<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Then: hook good habits onto moments you already have</title>
<meta name="description" content="Then is a calm habit tool. Hook one tiny habit onto a moment you already have. No alarms, no streaks, nothing resets.">
<meta name="theme-color" content="#141311">
<link rel="icon" type="image/svg+xml" href="/assets/brand/then-app-icon.svg">
<link rel="apple-touch-icon" href="/assets/brand/then-app-icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;display=swap">
<style>
/* Layout: one narrow column, one thing at a time. Your day is drawn as a thread with a knot per habit. Dark-first, warm charcoal with amber. */
:root{
  --bg:#141311; --surface:#1F1D1A; --line:#2A2824; --track:#34312C;
  --fg:#EFEAE0; --muted:#A39C8F; --dim:#6F695F;
  --accent:#F29E4C; --accent-ink:#141311; --accent-text:#F29E4C; --focus:#F7B878; --danger:#E58A7A;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F1EC; --surface:#FFFFFF; --line:#E3DED5; --track:#D9D3C8;
    --fg:#1F1C18; --muted:#5F584E; --dim:#8B8377;
    --accent:#E8862A; --accent-ink:#1F1C18; --accent-text:#9A4A00; --focus:#9A4A00; --danger:#B23B2A;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F1EC; --surface:#FFFFFF; --line:#E3DED5; --track:#D9D3C8;
  --fg:#1F1C18; --muted:#5F584E; --dim:#8B8377;
  --accent:#E8862A; --accent-ink:#1F1C18; --accent-text:#9A4A00; --focus:#9A4A00; --danger:#B23B2A;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,p{margin:0}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#h:focus{outline:none}

#app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:24px;padding-block:20px 32px;display:flex;flex-direction:column;gap:22px}
.spacer{flex-grow:1}
.stack{display:flex;flex-direction:column;gap:4px}
.h1{font-size:clamp(34px,11.5vw,46px);font-weight:800;line-height:1.03;letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
.h1.sm{font-size:clamp(30px,9vw,36px)}
.h1.md{font-size:clamp(32px,10vw,40px)}
.dim{color:var(--dim)}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.45}
.lead{font-size:17px;line-height:1.5}
.lead b,.hl{color:var(--fg);font-weight:400}
.sec{font-size:15px;font-weight:500;color:var(--muted)}

.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.back,.navlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:none;color:var(--fg);font-size:16px;cursor:pointer}
.navlink{color:var(--accent-text);font-weight:500;padding-inline:4px}
.bars{display:flex;gap:6px}
.bars span{flex-grow:1;height:4px;border-radius:2px;background:var(--track)}
.bars span.on{background:var(--accent)}

.cta{width:100%;min-height:64px;padding:6px 8px 6px 28px;border:0;border-radius:32px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:700;cursor:pointer;text-align:left}
.cta .dot{flex-shrink:0;width:48px;height:48px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center}
.cta.done{padding:6px 28px 6px 6px;justify-content:flex-start;gap:14px}
.cta.done .dot{width:52px;height:52px}
.cta.quiet{background:var(--surface);color:var(--fg);border:1.5px solid var(--track);font-weight:500;font-size:17px}
.cta.quiet .dot{background:var(--track);color:var(--accent-text)}
.cta.plain{justify-content:center;padding:0 28px}
.link{align-self:center;min-height:48px;padding:0 16px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}
.link.strong{color:var(--fg);font-weight:500}
.link.accent{color:var(--accent-text);font-weight:500}
.link.danger{color:var(--danger)}
.link.left{align-self:flex-start;padding-inline:0}

.thread{margin-left:7px;border-left:2px solid var(--dim)}
.node{position:relative;display:flex;align-items:center;gap:12px;padding:6px 0 6px 22px}
.knot{position:absolute;left:-9px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.node.is-done .knot{background:var(--accent);border-color:var(--accent)}
.node .txt{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.node .cue{font-size:14px;color:var(--muted)}
.node .act{font-size:19px;font-weight:500;overflow-wrap:anywhere}
.node.is-done .act{color:var(--muted);text-decoration:line-through}
.check{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2px solid var(--dim);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.rows{border-top:1px solid var(--line)}
.rowbtn{width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;font-size:19px;font-weight:500;cursor:pointer;text-decoration:none}
.rowbtn .t{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.rowbtn .n{font-size:14px;font-weight:400;color:var(--muted)}
.rowbtn .n.hot{color:var(--accent-text)}
.rowbtn[data-act="pickMoment"] .n{color:var(--accent-text)}
.rowbtn .mins{font-size:15px;font-weight:700;color:var(--accent-text)}
.rowbtn[aria-pressed="true"]{font-weight:700}
.radio{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;color:transparent}
.rowbtn[aria-pressed="true"] .radio{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chev{flex-shrink:0;color:var(--muted)}
.plainrow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0;border-bottom:1px solid var(--line)}
.plainrow .t{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.iconbtn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;color:var(--muted)}
.field label.big{font-size:16px;font-weight:500;color:var(--fg)}
.field input,.field select,.field textarea{min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--dim);background:var(--surface);color:var(--fg);font-size:17px;width:100%}
.field textarea{padding:12px 16px;min-height:112px;font-size:14px;line-height:1.45;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:1}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex-grow:1;min-width:0}
.mini{min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--fg);color:var(--bg);font-size:16px;font-weight:700;cursor:pointer}

.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.row{flex-direction:row;align-items:flex-start;gap:14px}
.card h2{font-size:17px;font-weight:700}
.card .kicker{font-size:15px;font-weight:500;color:var(--accent-text)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:48px;padding:0 6px;border:0;border-radius:24px;background:var(--track);color:var(--fg);font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:24px;font-weight:800;line-height:1.2}
.stats span{font-size:14px;color:var(--muted)}

.durs{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.durs button{min-width:48px;min-height:64px;padding:0;border:0;border-bottom:4px solid transparent;background:none;color:var(--dim);font-size:clamp(56px,20vw,72px);font-weight:800;line-height:1;letter-spacing:-.03em;cursor:pointer}
.durs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.clock{font-size:clamp(64px,26vw,96px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.track{position:relative;height:20px}
.track i{position:absolute;display:block}
.tally{display:flex;justify-content:space-between;align-items:flex-end;height:28px}
.tally i{display:block;width:3px;border-radius:2px}
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex-shrink:0;width:min(176px,44vw);height:auto}


.art{margin:0;background:var(--surface);border-radius:22px;padding:14px 10px 10px}
.art svg{display:block;width:100%;height:auto;overflow:visible}
.art .l{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.art .w4{stroke-width:4.5}.art .w6{stroke-width:6}
.sa{stroke:var(--accent-text)}.sf{stroke:var(--fg)}.sd{stroke:var(--dim)}.sx{stroke:var(--danger)}
.fa{fill:var(--accent-text)}.ff{fill:var(--fg)}.fm{fill:var(--muted)}.fx{fill:var(--danger)}
.art text{font-family:var(--font);font-size:15px}
.dr{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--t,.8s) cubic-bezier(.4,0,.2,1) both;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.fd{opacity:0;animation:fade .5s ease both;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.rowbtn .num{flex-shrink:0;width:26px;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rowbtn .seen{flex-shrink:0;display:flex;color:var(--accent-text)}
.navrow{display:flex;gap:4px}

/* brand, mascot, onboarding, home */
:root{--accent-deep:#D9822F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--accent-deep:#C96F12}}
:root[data-theme="light"]{--accent-deep:#C96F12}
.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{animation:reveal 1.1s ease-out .3s both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.wm{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.wm i{font-style:normal;color:var(--accent-text)}
.ob0{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px}
.ob-t{display:flex;justify-content:center}
.center{text-align:center}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--track);font-size:15px;color:var(--fg)}
.pill svg{color:var(--accent-text)}
.trow{display:flex;align-items:center;gap:8px}
.tbtn{flex-shrink:0;border:0;background:none;padding:0;min-width:44px;min-height:44px;cursor:pointer;border-radius:24px}
.bubble{position:relative;background:var(--surface);border-radius:18px;padding:12px 16px;font-size:16px;line-height:1.4;flex-grow:1}
.bubble::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;width:12px;height:12px;background:var(--surface);transform:rotate(45deg);border-radius:2px}
.buddy{display:block;overflow:visible}
.logo{border-radius:22%;box-shadow:0 0 0 1.5px var(--line);flex-shrink:0}
.tl-body{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.buddy.pop .tl-body{animation:pop .8s cubic-bezier(.3,1.6,.5,1) .15s both,bob 3.4s ease-in-out .95s infinite}
@keyframes pop{from{transform:scale(.2) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.tbtn.poked .tl-body{animation:poke .5s ease both}
@keyframes poke{30%{transform:scale(1.08,.9)}60%{transform:scale(.96,1.06) translateY(-6px)}100%{transform:none}}
.tl-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pup{transform:translate(var(--px,0px),var(--py,1.5px));transition:transform .12s ease-out}
.tl-tail{fill:none;stroke:var(--muted);stroke-width:3.5;stroke-linecap:round}
.arm{stroke:var(--accent-deep);fill:none;stroke-width:8;stroke-linecap:round}
.arm-wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.spark{fill:none;stroke:var(--accent-text);stroke-width:3;stroke-linecap:round;animation:twinkle 1.6s ease-out both;animation-delay:var(--d,0s)}
@keyframes twinkle{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.1)}100%{opacity:.85;transform:scale(1)}}
.spark{transform-box:fill-box;transform-origin:center}
.hd{display:flex;align-items:center;gap:12px;min-height:48px}
.hd .who{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.hd .who b{font-size:17px;font-weight:600;line-height:1.2}
.hd .who span{font-size:14px;color:var(--muted)}
.week{display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.wk b{font-size:13px;font-weight:500;color:var(--muted)}
.wd{display:block;width:24px;height:24px;border-radius:50%;border:2px solid var(--track)}
.wd.f{background:var(--accent);border-color:var(--accent)}
.wd.s{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 42%,transparent 46%)}
.wd.t{border-color:var(--fg)}
.wd.pre{border-style:dashed;opacity:.5}
.goal{display:flex;flex-direction:column;gap:8px}
.gb{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.gb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{min-height:60px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent-text);font-weight:700}
#app.has-tabs{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.stickycta{position:sticky;bottom:0;padding:16px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.tabs-on .toast{top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.forme{color:var(--accent-text)}
.lock{display:flex;gap:12px;align-items:flex-start}
.toast[hidden]{display:none}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:448px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:16px;padding:6px 8px 6px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:16px;z-index:5}
.toast button{min-height:44px;padding:0 12px;border:0;background:none;color:var(--bg);font-size:16px;font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.dr{stroke-dashoffset:0!important}.fd{opacity:1!important}.pup{transition:none!important}}
button{transition:background-color .15s,border-color .15s,color .15s}
</style>
</head>

<div id="app"></div>

/* ---------- storage ---------- */
var KEY = 'then.v1';
var storageOk = true;
function fresh(){ return { v:1, seen:false, theme:'system', habits:[], shotsRead:{}, profile:{name:''}, likes:[{t:'Tidy one surface',m:8},{t:'Text someone you miss',m:5}] }; }
function load(){
  try {
    localStorage.setItem('then.t', '1'); localStorage.removeItem('then.t');
    var r = localStorage.getItem(KEY);
    if (r) { var s = JSON.parse(r); if (s && Array.isArray(s.habits)) { s.likes = Array.isArray(s.likes) ? s.likes : []; s.shotsRead = s.shotsRead && typeof s.shotsRead === 'object' ? s.shotsRead : {}; s.profile = s.profile && typeof s.profile === 'object' ? s.profile : {name:''}; return s; } }
  } catch (e) { storageOk = false; }
  return fresh();
}
var S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } }
function applyTheme(){
  var r = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark') r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
}

function cue(h){ return 'After ' + h.moment; }
function byId(id){ for (var i = 0; i < S.habits.length; i++) if (S.habits[i].id === id) return S.habits[i]; return null; }
function age(h){ return diffDays(h.created, todayStr()) + 1; }
function slipped(h){ var t = todayStr(), y = addDays(t, -1); return h.created < y && !h.log[y] && !h.log[t] && !FULL[h.id]; }
function slipCount(h){
  var t = todayStr(), n = Math.min(10, diffDays(h.created, t)), m = 0;
  for (var d = 1; d <= n; d++) if (!h.log[addDays(t, -d)]) m++;
  return [m, n];
}
function last42(h){
  var t = todayStr(), n = Math.min(42, age(h)), c = 0;
  for (var d = 0; d < n; d++) if (h.log[addDays(t, -d)]) c++;
  return [c, n];
}
function checkDue(h){
  if (age(h) < 7) return false;
  var c = h.checks || [];
  return !c.length || diffDays(c[c.length - 1].d, todayStr()) >= 7;
}
function ready(h){
  var c = h.checks || [];
  if (c.length < 3) return false;
  if (h.deferred && diffDays(h.deferred, todayStr()) < 14) return false;
  return c.slice(-3).every(function(x){ return x.v === 2; });
}
function thisWeekCheck(h){
  var c = h.checks || [];
  if (!c.length) return null;
  var l = c[c.length - 1];
  return diffDays(l.d, todayStr()) < 7 ? l : null;
}
function weekNum(h){ return Math.floor((age(h) - 1) / 7) + 1; }

/* ---------- shots: short lessons with line drawings ---------- */
function vis(s, at){ var a = Array.isArray(at) ? at[0] : at, b = Array.isArray(at) ? at[1] : 9; return s >= a && s <= b; }
function isNew(s, at){ return s === (Array.isArray(at) ? at[0] : at); }
/* drawn stroke: s = current frame, at = frame (or [from,to]) it shows in, d = delay, t = duration */
function ln(s, at, d, c, tag, attrs, t){
  if (!vis(s, at)) return '';
  var a = isNew(s, at);
  return '<' + tag + ' class="l ' + c + (a ? ' dr' : '') + '" pathLength="1"' + (a ? ' style="--d:' + d + 's' + (t ? ';--t:' + t + 's' : '') + '"' : '') + ' ' + attrs + '/>';
}
/* faded item (fills, text) */
function fx(s, at, d, c, tag, attrs, inner){
  if (!vis(s, at)) return '';
  var a = isNew(s, at);
  if (a) attrs = /style="/.test(attrs) ? attrs.replace('style="', 'style="--d:' + d + 's;') : attrs + ' style="--d:' + d + 's"';
  var open = '<' + tag + ' class="' + c + (a ? ' fd' : '') + '" ' + attrs;
  return inner == null ? open + '/>' : open + '>' + inner + '</' + tag + '>';
}
function chev(cx, cy, r, deg, sz){
  var a = deg * Math.PI / 180, tx = -Math.sin(a), ty = Math.cos(a), px = cx + r * Math.cos(a), py = cy + r * Math.sin(a), nx = -ty, ny = tx;
  var bx = px - sz * tx, by = py - sz * ty, k = .7 * sz, f = function(n){ return n.toFixed(1); };
  return 'M' + f(bx + k * nx) + ' ' + f(by + k * ny) + ' L' + f(px) + ' ' + f(py) + ' L' + f(bx - k * nx) + ' ' + f(by - k * ny);
}

    case 'gradOpen': go('graduate', {id:ds.id}); break;
    case 'gradYes': { var g = byId(ds.id); g.status = 'graduated'; g.gradDate = todayStr(); save(); go('list'); toast('Graduated. A slot just opened.'); break; }
    case 'gradLater': { var g2 = byId(ds.id); g2.deferred = todayStr(); save(); go('today'); toast('We\'ll ask again in two weeks.'); break; }
    case 'free': F.mins = F.mins || 10; go('free'); break;
    case 'dur': F.mins = +ds.m; render(false); break;
    case 'startItem': { var it = OPTS[+ds.i]; TM = {item:it, total:it.m * 60, left:it.m * 60, running:false, endAt:0, iv:null}; go('doing'); break; }
    case 'tstart':
      if (!TM || TM.left <= 0) break;
      if (TM.running) { TM.left = Math.max(0, Math.ceil((TM.endAt - Date.now()) / 1000)); TM.running = false; stopTimer(); }
      else { TM.endAt = Date.now() + TM.left * 1000; TM.running = true; TM.iv = setInterval(tick, 250); }
      render(false); var b = $('[data-act="tstart"]'); if (b) b.focus(); break;
    case 'tdone': {
      var item = TM && TM.item; stopTimer();
      if (item && item.hid) { var hd = byId(item.hid), td = todayStr(); if (hd && !hd.log[td]) { logDone(hd, item.kind); go('today'); toast('Counted. Well done.', function(){ delete hd.log[td]; save(); render(false); }); break; } }
      go('today'); toast('Nice. That was a good use of the time.'); break; }
    case 'addLike': {
      var tx = (D.likeT || '').trim();
      if (!tx) { toast('Write what you like doing first.'); break; }
      S.likes.push({t:tx, m:+(D.likeM || 5)}); D.likeT = ''; save(); render(false); toast('Added.'); break; }
    case 'delLike': S.likes.splice(+ds.i, 1); save(); render(false); break;
    case 'theme': S.theme = ds.v; save(); applyTheme(); render(false); break;
    case 'copyExport': {
      var ta = $('#export'); ta.select();
      var done = function(){ toast('Backup copied.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function(){ toast('Copy failed. The text is selected, so copy it by hand.'); });
      else toast('The text is selected. Copy it by hand.');
      break; }
    case 'importGo': {
      try {
        var obj = JSON.parse((D.importText || '').trim());
        if (!obj || !Array.isArray(obj.habits)) throw new Error('bad');
        obj.likes = Array.isArray(obj.likes) ? obj.likes : []; obj.shotsRead = obj.shotsRead && typeof obj.shotsRead === 'object' ? obj.shotsRead : {}; obj.profile = obj.profile && typeof obj.profile === 'object' ? obj.profile : {name:''}; obj.v = 1; S = obj; save(); applyTheme(); D.importText = ''; go('list'); toast('Backup restored.');
      } catch (er) { toast('That doesn\'t look like a backup. Paste the full text.'); }
      break; }
    case 'resetAsk': CONF.reset = true; render(false); break;
    case 'resetNo': CONF.reset = false; render(false); break;
    case 'resetYes': S = fresh(); save(); applyTheme(); D = {}; CEL = null; go('intro'); toast('All data deleted.'); break;
    case 'clearExamples': S.habits = S.habits.filter(function(x){ return !x.example; }); save(); render(false); toast('Examples cleared.'); break;
    case 'undo': if (lastUndo) { lastUndo(); lastUndo = null; $('#toast').hidden = true; } break;
  }
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  act(el.dataset.act, el);
});
document.addEventListener('input', function(e){
  var k = e.target && e.target.dataset ? e.target.dataset.in : null;
  if (k) D[k] = e.target.value;
});
document.addEventListener('change', function(e){
  var k = e.target && e.target.dataset ? e.target.dataset.in : null;
  if (k === 'likeM') D.likeM = e.target.value;
});
var ptRaf = 0, ptLast = null, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointermove', function(e){
  if (e.pointerType === 'touch' || reduce) return;
  ptLast = e; if (ptRaf) return;
  ptRaf = requestAnimationFrame(function(){
    ptRaf = 0;
    var svgs = document.querySelectorAll('svg.buddy:not([data-still])');
    for (var i = 0; i < svgs.length; i++) {
      var r = svgs[i].getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .5;
      var dx = ptLast.clientX - cx, dy = ptLast.clientY - cy, d = Math.sqrt(dx * dx + dy * dy) || 1, k = Math.min(4.2, d / 28);
      svgs[i].style.setProperty('--px', (dx / d * k).toFixed(2) + 'px'); svgs[i].style.setProperty('--py', (dy / d * k).toFixed(2) + 'px');
    }
  });
});
document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target && e.target.id === 'pname') { e.preventDefault(); act('obName', e.target); } });
document.addEventListener('visibilitychange', function(){ if (!document.hidden && TM && TM.running) tick(); });

applyTheme();
V = homeView();
if (V === 'intro' && S.profile && S.profile.name) { var qc = quizCount(); if (qc < QS.length) P = {i:qc}, V = 'ask'; else V = 'learned'; }
render(false);
})();
</script>
</body>
